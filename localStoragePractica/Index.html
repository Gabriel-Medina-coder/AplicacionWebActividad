<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con guardado</title>
</head>
<body>
    <header>
        <center><h1>Registrate</h1></center>
    </header>

    <section>

    <label for="Nombre">Nombre:</label>
    <input type="text" class="Name">
    <label for="ApellidoPaterno">Apellido Paterno:</label>
    <input type="text" class="ApellidoPaterno">
    <label for="ApellidoMaterno">Apellido Materno:</label>
    <input type="text" class="ApellidoMaterno">

    </section>
    <p></p>
    <section>

    <label for="Date">Fecha de nacimiento:</label>
    <input type="date" class="FechaNacimiento">
    <label for="Correo">Correo:</label>
    <input type="email" class="Correo">
    </section>

    <section>
        <button class="btnGuardar">
            Guardar Datos
        </button>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
